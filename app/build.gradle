plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scell.novelreader.redesign'
    compileSdk 34

    defaultConfig {
        applicationId "com.scell.novelreader.redesign"
        minSdk 24
        targetSdk 34
        // Every GitHub Actions run has a higher number than the last, so each
        // new APK is a valid *update* over the installed one (Android refuses
        // to install an APK whose versionCode is lower than the installed one).
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode runNumber
        versionName "1.0.${runNumber}"

        // The bundled yt-dlp/Python/ffmpeg (see the dependencies below) come with native libraries
        // for four CPU types; real phones are arm64-v8a (or, rarely, armeabi-v7a). Leaving the
        // x86 ones out roughly halves the APK. Add them back to run on an x86 emulator.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // youtubedl-android starts Python and ffmpeg as programs out of the app's native-library folder,
    // so the libraries must be unpacked on install instead of being read from inside the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Two builds of the same app (see "Two versions" in README.md):
    //   full     the app with the music player (default)
    //   noaudio  the same app without it: no music panel, no playback service, no notification /
    //            foreground-service permissions, no song downloads. It has the SAME application id
    //            and signing key as "full", so only one of them can be installed at a time and
    //            installing either over the other is an update (chapters and settings stay). Its
    //            APK has its own name in every GitHub Release, which the in-app updater uses to
    //            pick the right file, so each one keeps updating as itself.
    // The no-audio build is made by overlays in app/src/noaudio/ (manifest, app name, and stub
    // versions of audio-player.js / spotify-ui.js / song-download.js) plus the BuildConfig.HAS_AUDIO
    // checks in MainActivity.kt and AppUpdater.kt. Nothing in app/src/main is a copy.
    flavorDimensions 'audio'
    productFlavors {
        full {
            dimension 'audio'
            buildConfigField 'boolean', 'HAS_AUDIO', 'true'
        }
        noaudio {
            dimension 'audio'
            versionNameSuffix '-noaudio'
            buildConfigField 'boolean', 'HAS_AUDIO', 'false'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // The signing key is NOT stored in the repo. Android only lets a new APK
    // update an installed app when both are signed with the SAME key, so CI
    // supplies it through four environment variables (filled from the GitHub
    // secrets by .github/workflows/build-apk.yml):
    //   ANDROID_KEYSTORE_PATH      path of the decoded keystore file
    //   ANDROID_KEYSTORE_PASSWORD  keystore password
    //   ANDROID_KEY_ALIAS          key alias
    //   ANDROID_KEY_PASSWORD       key password
    // If any of them is missing (e.g. a build from Android Studio), the build
    // falls back to Android's default debug key: that APK installs, but it
    // cannot update an app that was installed from a build signed with the
    // real key (see "Signing and updates" in README.md).
    def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def signingAlias = System.getenv("ANDROID_KEY_ALIAS")
    def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def hasSharedKey = signingPath && signingStorePassword && signingAlias && signingKeyPassword &&
            file(signingPath).isFile()

    signingConfigs {
        if (hasSharedKey) {
            shared {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig hasSharedKey ? signingConfigs.shared : signingConfigs.debug
        }
        release {
            signingConfig hasSharedKey ? signingConfigs.shared : signingConfigs.debug
            // R8 removes unused code and optimises the rest. It does NOT rename
            // anything (-dontobfuscate in proguard-rules.pro), so stack traces in
            // crash_log.txt stay readable. Resource shrinking is not enabled.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Serves the app's own page from an https origin
    // (https://appassets.androidplatform.net/) instead of file:// — see
    // MainActivity.kt's WebViewAssetLoader setup. 1.11.0 builds against
    // compileSdk 34, matching this project.
    implementation 'androidx.webkit:webkit:1.11.0'

    // Real background audio playback (PlaybackService.kt): ExoPlayer for
    // decoding/playback, media3-session for the MediaSession that gives
    // us the system media notification, lock-screen transport controls,
    // and audio-focus/headset handling for free.
    //
    // PINNED TO 1.4.1 DELIBERATELY — newer media3 releases raise the
    // *minimum compileSdk* their AAR metadata demands (1.10.1 requires
    // compileSdk 36; this project builds against compileSdk 34, and AGP
    // 8.5.2 doesn't support going past 34 anyway), which fails the build
    // at the `checkDebugAarMetadata` task before a single line of Kotlin
    // even compiles. 1.4.1 is confirmed to require only compileSdk 34 —
    // an exact match. All the APIs this project actually uses
    // (MediaSessionService, MediaSession, MediaController, ForwardingPlayer,
    // the COMMAND_SEEK_TO_*_MEDIA_ITEM commands) have been stable since
    // early 1.x, so nothing here needed to change to support the
    // downgrade. If you bump this later, bump compileSdk/targetSdk (and
    // check AGP's supported range) in the same change, or you'll hit
    // this exact failure again.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // "Download songs": yt-dlp (+ Python, + ffmpeg for mp3 conversion and cover art) bundled in the
    // app, run by SongDownloader.kt. Both modules must have the same version. 0.17.4 is pinned like
    // media3 above: its AARs need only compileSdk 34 and minSdk 24, which is what this project has.
    // yt-dlp itself is updated from inside the app when a download fails (see SongDownloader.kt).
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
