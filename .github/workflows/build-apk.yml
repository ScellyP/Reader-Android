name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  # Decides whether a build is wanted. A push only builds when one of its
  # commit messages contains a version number like v1.04.05 (a leading "v"
  # followed by three dot-separated numbers; a suffix such as -beta is fine).
  # Every other commit is skipped, so no APK is built. Running the workflow
  # by hand from the Actions tab (workflow_dispatch) always builds.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Look for a version number in the commit message(s)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run - building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$COMMIT_MESSAGES" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Version number found in the commit message - building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version number (like v1.04.05) in the commit message - skipping the build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # Needed to publish the GitHub Release the in-app updater reads (last step).
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key from GitHub secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
              echo "SIGNED_WITH_REAL_KEY=true"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from GitHub secrets."
          else
            echo "::warning::Signing secrets are not set - building with the default debug key (this APK cannot update an app signed with the real key)."
          fi

      # Builds both versions of the app (flavors "full" = with the music player, "noaudio" = without),
      # each as release and debug: four APKs. See "Two versions" in README.md.
      - name: Build release and debug APKs (both versions)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload release APK artifact (with audio player)
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-release-apk
          path: app/build/outputs/apk/full/release/app-full-release.apk

      - name: Upload debug APK artifact (with audio player)
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Upload release APK artifact (no audio player)
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-noaudio-release-apk
          path: app/build/outputs/apk/noaudio/release/app-noaudio-release.apk

      - name: Upload debug APK artifact (no audio player)
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-noaudio-debug-apk
          path: app/build/outputs/apk/noaudio/debug/app-noaudio-debug.apk

      # The in-app updater (AppUpdater.kt) reads the newest GitHub Release of this repo. Only a build
      # signed with the real key is published: Android refuses to update an app with an APK signed by a
      # different key, so a debug-signed Release would be offered to phones and then fail to install.
      # The tag is APP_VERSION from version.js; a redone build of the same version replaces the asset.
      - name: Publish GitHub Release (for the in-app updater)
        if: env.SIGNED_WITH_REAL_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep -oE "APP_VERSION = 'v[0-9]+\.[0-9]+\.[0-9]+" app/src/main/assets/version.js | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$TAG" ]; then
            echo "::warning::Could not read APP_VERSION from version.js - no Release published."
            exit 0
          fi
          APK="novel-reader-$TAG.apk"
          APK_NOAUDIO="novel-reader-noaudio-$TAG.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "$APK"
          cp app/build/outputs/apk/noaudio/release/app-noaudio-release.apk "$APK_NOAUDIO"
          # The full APK goes first and alone: older installed copies of the app take the FIRST .apk
          # of the newest Release, so it must be the full one. The no-audio APK is added afterwards.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "${{ github.sha }}" \
              --title "Novel Reader $TAG" --notes "Built from commit ${{ github.sha }}. novel-reader-$TAG.apk has the music player; novel-reader-noaudio-$TAG.apk is the same app without it." --latest
          fi
          gh release upload "$TAG" "$APK_NOAUDIO" --clobber
