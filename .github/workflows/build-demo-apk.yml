name: Build Demo APK

on:
  push:
    branches-ignore: [ main, master ]
  workflow_dispatch: {}

# One demo build per branch at a time; a newer push cancels an older running one.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a build is wanted. A push only builds when one of its
  # commit messages contains a version number like v1.04.05 (a leading "v"
  # followed by three dot-separated numbers; a suffix such as -beta is fine).
  # Every other commit is skipped, so no APK is built. Running the workflow
  # by hand from the Actions tab (workflow_dispatch) always builds.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Look for a version number in the commit message(s)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run - building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$COMMIT_MESSAGES" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Version number found in the commit message - building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version number (like v1.04.05) in the commit message - skipping the build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      # Demo app: id <normal id>.demo, label "Novel Reader (Demo)", own
      # settings-demo.txt. Installs next to the normal app (see app/build.gradle).
      NR_DEMO: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key from GitHub secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from GitHub secrets."
          else
            echo "::warning::Signing secrets are not set - building with the default debug key (this APK cannot update an app signed with the real key)."
          fi

      - name: Build release and debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace -PnrDemo=true

      - name: Check the demo APKs really have their own app id
        run: |
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort | tail -1)
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^package:|^application-label:" | tee -a "$GITHUB_STEP_SUMMARY"
            if ! "$AAPT2" dump badging "$apk" | grep -q "^package: name='com.scell.novelreader.redesign.demo'"; then
              echo "::error::$apk does not have the .demo app id - it would try to replace the normal app."
              exit 1
            fi
          done

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-demo-release-apk
          path: app/build/outputs/apk/release/novel-reader-demo-release.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-demo-debug-apk
          path: app/build/outputs/apk/debug/novel-reader-demo-debug.apk
